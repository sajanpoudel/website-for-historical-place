<style>

.main-row{

.col-3{

.row-img{
height:300px;

}

}
.site-nav{

}
}
.row-img{

}
.lightbox{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
background:rgba(0,0,0,0.85);
z-index:10;
}
.lightbox[hidden]{
display:none;
}
.lightbox img{
max-width:90%;
max-height:90%;
}
.row-img:hover{
border:10px solid yellowgreen;

transition:all 2s;
}
</style>
</head>
